seo:
  title: "Ekaa, The Event Collective | Wedding Planning in Mumbai"
  description: "Ekaa is a Mumbai wedding planner that handles design, vendors, and execution so you can plan your wedding without the chaos. Beyond events, we create memories."
  og_image: "/static/img/hero.jpg"
  domain: "https://ekaaco.in"

hero:
  kicker: "Wedding planning, Mumbai and across India"
  heading: "Beyond events, we create memories"
  subheading: "A calm, design led wedding partner who handles everything, built on real large event experience."
  cta: "Start the conversation"
  cta_secondary: "See how we work"
  image: "img/hero.jpg"
  image_alt: "An Ekaa wedding stage glowing under evening light, couple at the centre"

intro:
  heading: "Plan your wedding without the chaos"
  body: >
    Ekaa is a wedding planning company. We shape the design, bring together the
    right vendors, and run the whole thing on the ground, so the two of you stay
    present for the parts that matter. You enjoy your wedding. We carry the rest.
  image: "img/intro-recce.jpg"
  image_alt: "Ekaa on a venue recce, planning on the ground before the day"
  stats:
    - "One Project Head, start to end."
    - "Fewer weddings each season."
    - "Transparent commercials, no padding."

services:
  heading: "What we do"
  intro: "Everything a wedding needs, held in one calm pair of hands."
  pillars:
    - title: "Design and styling"
      body: "A look and feel that is yours. Mood, colour, decor, and the small details that make a day feel considered rather than copied."
      image: "img/pillar-design.jpg"
      image_alt: "A styled wedding stage with terracotta drapes and floral mandap circles"
    - title: "Vendor curation and management"
      body: "The right people for your budget and taste. We find them, brief them, negotiate, and keep everyone moving so you do not have to chase anyone."
      icon: "handshake"   # no photo yet, uses a terracotta line icon
    - title: "Full on ground execution"
      body: "A team that runs the day end to end. Timelines, logistics, and quiet problem solving, so nothing reaches you on the day itself. Across Mumbai, India, and destination."
      image: "img/pillar-execution.jpg"
      image_alt: "Couple on stage with fireworks during an Ekaa wedding"
    - title: "Pre-wedding and the small days"
      body: "The sangeet you actually want to dance at. The mehendi that feels like home. The cocktail that does not run out of ice. The smaller days, planned with the same care as the wedding day itself."
      image: "img/pillar-prewedding.jpg"
      image_alt: "A pastel pre-wedding celebration set up by Ekaa"

founder:
  heading: "Meet the founder"
  name: "Ishaan Saklecha"
  role: "Founder"
  image: "img/founder.jpg"
  image_alt: "Ishaan Saklecha, founder of Ekaa, at a wedding venue"
  body: >
    I started Ekaa because a wedding deserves the same rigour as the biggest
    shows in the country. I spent years running large scale live events at
    BookMyShow Live, including the Coldplay India tour and two editions of
    Lollapalooza India. Tens of thousands of people, hundreds of moving parts,
    no room for error.
  body_2: >
    A wedding is smaller in headcount and far more personal, and it needs that
    same calm and control. That is what I bring. You get someone who has stood
    in the middle of real chaos and kept it invisible to everyone watching. On
    your wedding, the only thing you should feel is the day itself.
  location: "Mumbai. Available across India."

process:
  heading: "How we work"
  intro: "A clear path from first hello to the last dance."
  steps:
    - number: "01"
      title: "First conversation"
      body: "We meet, we listen, and we understand the wedding you actually want and the budget you are working with."
    - number: "02"
      title: "Design and planning"
      body: "We build the look, the plan, and the timeline. You see where everything is going before anything is booked."
    - number: "03"
      title: "Vendor lock in"
      body: "We bring the right vendors, handle the briefs and the commercials, and confirm every detail."
    - number: "04"
      title: "Flawless execution"
      body: "Our team runs the day on the ground. You stay present. We stay invisible."

